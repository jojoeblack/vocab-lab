<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字彙練習平台 · Vocab Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#201A24; --panel:#2B2230; --panel2:#342936; --line:#463A4B;
    --porcelain:#F2EDE4; --muted:#A395A8;
    --saffron:#E8B33C; --paprika:#D2553F; --pistachio:#8FB25B; --cobalt:#5B8FCB; --plum:#B77BC6; --mint:#6FC2A8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--porcelain);
    font-family:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:900px;margin:0 auto;padding:18px 18px 60px;}

  .bar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .logo{font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:600;letter-spacing:-.01em;}
  .logo span{color:var(--mint);}
  .bar .sp{flex:1;}
  button{font-family:inherit;cursor:pointer;}
  .chip{font-size:12.5px;color:var(--porcelain);background:transparent;border:1px solid var(--line);
    border-radius:999px;padding:5px 13px;transition:.15s;}
  .chip:hover{background:var(--panel2);}
  .chip[aria-pressed="true"]{background:var(--mint);color:var(--ink);border-color:var(--mint);font-weight:600;}
  button:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;}
  .btn{font-size:14px;font-weight:600;border:none;border-radius:10px;padding:12px 22px;transition:.15s;}
  .btn-p{background:var(--mint);color:var(--ink);}
  .btn-p:hover{filter:brightness(1.08);}
  .btn-s{background:transparent;color:var(--porcelain);border:1px solid var(--line);font-weight:500;}
  .btn-s:hover{background:var(--panel2);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;}
  .sec{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
  h2{font-family:"Fraunces",Georgia,serif;font-size:20px;margin:0 0 6px;font-weight:600;}
  .note{font-size:12.5px;color:var(--muted);line-height:1.75;}
  .zh{font-family:"Noto Sans TC",sans-serif;}

  /* 課程卡 */
  .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px;}
  .lcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;transition:.15s;}
  .lcard:hover{border-color:var(--muted);}
  .lcard h3{font-family:"Fraunces",Georgia,serif;font-size:17px;margin:0 0 4px;font-weight:600;}
  .lcard .m{font-size:11.5px;color:var(--muted);margin-bottom:13px;}
  .lcard .acts{display:flex;gap:6px;flex-wrap:wrap;}
  .lcard .acts button{font-size:12px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--porcelain);transition:.15s;}
  .lcard .acts button:hover{background:var(--panel2);border-color:var(--mint);color:var(--mint);}
  .src{display:inline-block;font-size:10px;letter-spacing:.06em;padding:1px 7px;border-radius:4px;margin-left:7px;vertical-align:2px;}
  .src.b{background:rgba(163,149,168,.2);color:var(--muted);}
  .src.s{background:rgba(111,194,168,.18);color:var(--mint);}
  .src.p{background:rgba(232,179,60,.18);color:var(--saffron);}

  /* 單字表 */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);}
  td{padding:10px 6px;border-bottom:1px solid rgba(70,58,75,.5);vertical-align:top;}
  td.w{font-family:"Fraunces",Georgia,serif;font-size:16px;white-space:nowrap;}
  td.w .g{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;}
  td.z{font-family:"Noto Sans TC",sans-serif;font-size:12.5px;color:#DCD2DE;}
  td.e{font-size:12.5px;color:var(--mint);line-height:1.6;}
  .say{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:3px 6px;line-height:0;}
  .say:hover{color:var(--saffron);border-color:var(--saffron);}
  .say.on{color:var(--saffron);border-color:var(--saffron);}
  .say svg{width:12px;height:12px;fill:currentColor;}

  /* 閃卡 */
  .flash{text-align:center;padding:10px 0;}
  .fc{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:46px 24px;min-height:210px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;cursor:pointer;}
  .fc .big{font-family:"Fraunces",Georgia,serif;font-size:40px;line-height:1.15;}
  .fc .zh{font-size:19px;}
  .fc .ez{font-size:14px;color:var(--mint);line-height:1.65;max-width:460px;}
  .fc .ex{font-size:13.5px;color:var(--muted);line-height:1.65;max-width:460px;}
  .fc .tap{font-size:12px;color:var(--muted);}

  /* 聽打 */
  .top{display:flex;align-items:center;gap:13px;margin-bottom:15px;flex-wrap:wrap;}
  .prog{flex:1;min-width:130px;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;}
  .prog i{display:block;height:100%;background:var(--mint);width:0;transition:width .35s;}
  .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .score{font-family:"Fraunces",Georgia,serif;font-size:19px;font-variant-numeric:tabular-nums;}
  .score small{font-size:12px;color:var(--muted);font-family:"IBM Plex Sans",sans-serif;}
  .pz{text-align:center;padding:16px 0 4px;}
  .play{width:92px;height:92px;border-radius:50%;border:2px solid var(--saffron);background:rgba(232,179,60,.1);
    color:var(--saffron);display:inline-flex;align-items:center;justify-content:center;transition:.15s;}
  .play:hover{background:rgba(232,179,60,.2);}
  .play.on{background:var(--saffron);color:var(--ink);}
  .play svg{width:36px;height:36px;fill:currentColor;}
  .kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--panel2);border:1px solid var(--line);
    border-radius:4px;padding:1px 6px;}
  .inrow{display:flex;gap:10px;margin:16px 0 10px;}
  input[type=text],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--porcelain);font-family:inherit;font-size:14px;padding:11px 13px;outline:none;transition:.15s;width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--mint);}
  #ans{flex:1;font-family:"Fraunces",Georgia,serif;font-size:25px;text-align:center;border-width:2px;padding:14px 12px;}
  #ans.bad{border-color:var(--paprika);animation:sh .32s;}
  #ans.good{border-color:var(--pistachio);}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .aux{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;}
  .aux button{font-size:12px;color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:7px;padding:6px 11px;}
  .aux button:hover{color:var(--porcelain);border-color:var(--muted);}
  .fb{margin-top:15px;padding:14px 16px;border-radius:11px;font-size:14px;line-height:1.7;}
  .fb.wrong{background:rgba(210,85,63,.12);border:1px solid rgba(210,85,63,.4);}
  .fb.right{background:rgba(143,178,91,.12);border:1px solid rgba(143,178,91,.4);}
  .fb.tip{background:rgba(232,179,60,.1);border:1px solid rgba(232,179,60,.35);}
  .fb-h{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px;font-weight:600;}
  .fb.wrong .fb-h{color:var(--paprika);} .fb.right .fb-h{color:var(--pistachio);} .fb.tip .fb-h{color:var(--saffron);}
  .diff{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.09em;margin:5px 0;word-break:break-all;}
  .diff .ok{color:var(--pistachio);} .diff .no{color:var(--paprika);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:4px;}
  .diff .miss{color:var(--muted);opacity:.5;}
  .big2{font-family:"Fraunces",Georgia,serif;font-size:60px;line-height:1;margin:0;font-variant-numeric:tabular-nums;}
  .big2 small{font-size:21px;color:var(--muted);}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 4px;}
  .stat{background:var(--panel2);border-radius:9px;padding:10px 15px;min-width:92px;text-align:center;}
  .stat .v{font-family:"Fraunces",Georgia,serif;font-size:21px;}
  .stat .k{font-size:11px;color:var(--muted);}
  .pill{font-size:11px;padding:2px 8px;border-radius:99px;}
  .pill.f{background:rgba(143,178,91,.2);color:var(--pistachio);}
  .pill.w{background:rgba(210,85,63,.2);color:var(--paprika);}

  /* 管理 */
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;}
  textarea{min-height:170px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.65;resize:vertical;}
  .steps{font-size:13px;line-height:1.95;font-family:"Noto Sans TC",sans-serif;counter-reset:s;}
  .steps li{margin-bottom:4px;}
  .steps code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--panel2);
    padding:2px 6px;border-radius:4px;color:var(--saffron);word-break:break-all;}
  .msg{font-size:13px;padding:11px 14px;border-radius:9px;margin-top:12px;line-height:1.7;}
  .msg.ok{background:rgba(143,178,91,.13);border:1px solid rgba(143,178,91,.4);color:var(--pistachio);}
  .msg.er{background:rgba(210,85,63,.13);border:1px solid rgba(210,85,63,.4);color:var(--paprika);}
  /* 遊戲化介面 */
  .rankbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    background:var(--panel2);border-radius:11px;padding:13px 16px;margin:14px 0 16px;}
  .rk{font-family:"Fraunces",Georgia,serif;font-size:19px;color:var(--mint);}
  .rules2{display:grid;gap:7px;}
  .rl{font-size:12.5px;line-height:1.65;font-family:"Noto Sans TC",sans-serif;color:#CFC4D2;
    background:var(--panel2);border-radius:9px;padding:9px 12px;border-left:3px solid var(--line);}
  .rl b{display:block;color:var(--porcelain);font-weight:600;margin-bottom:1px;}
  .rl.king{border-left-color:var(--saffron);background:rgba(232,179,60,.09);}
  .rl.king b{color:var(--saffron);}

  .mrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .mchip{font-size:12.5px;padding:5px 12px;border-radius:8px;font-family:"IBM Plex Mono",monospace;
    border:1px solid var(--line);background:var(--panel2);}
  .mchip.up{color:var(--pistachio);border-color:rgba(143,178,91,.45);}
  .mchip.dn{color:var(--paprika);border-color:rgba(210,85,63,.45);}
  .mchip.combo{color:var(--muted);}
  .mchip.combo.hot{color:var(--saffron);border-color:var(--saffron);
    background:rgba(232,179,60,.14);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .tbar{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;}
  .tbar i{display:block;height:100%;width:100%;background:var(--mint);transition:width .1s linear,background .3s;}
  .tinfo{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
    margin-top:5px;font-family:"IBM Plex Mono",monospace;}

  .kingcard{border-color:var(--saffron);box-shadow:0 0 0 1px rgba(232,179,60,.35),0 0 34px rgba(232,179,60,.14);}
  .kingbanner{background:linear-gradient(90deg,rgba(232,179,60,.22),rgba(232,179,60,.07));
    border:1px solid rgba(232,179,60,.45);color:var(--saffron);border-radius:10px;
    padding:10px 14px;margin-bottom:14px;font-family:"Noto Sans TC",sans-serif;font-size:14px;
    font-weight:600;text-align:center;animation:glow 1.6s ease-in-out infinite;}
  @keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}

  #pop{position:relative;height:0;}
  .fly{position:absolute;left:50%;top:-6px;transform:translateX(-50%);
    font-family:"Fraunces",Georgia,serif;font-size:28px;font-weight:600;pointer-events:none;
    animation:fly 1.15s ease-out forwards;white-space:nowrap;}
  .fly.good{color:var(--pistachio);}
  .fly.bad{color:var(--paprika);}
  .fly.combo{color:var(--saffron);font-size:22px;}
  .fly.king{font-size:38px;}
  @keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}
    18%{opacity:1;transform:translate(-50%,-6px) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}

  .rankbig{font-family:"Fraunces",Georgia,serif;font-size:76px;line-height:1;font-weight:600;}
  .best{display:inline-block;margin-top:9px;font-size:12px;color:var(--saffron);
    border:1px solid rgba(232,179,60,.45);border-radius:99px;padding:3px 12px;}
  .levelup{background:rgba(111,194,168,.13);border:1px solid rgba(111,194,168,.45);color:var(--mint);
    border-radius:10px;padding:12px;text-align:center;font-family:"Noto Sans TC",sans-serif;
    font-size:15px;margin-bottom:16px;}
  .xpbox{background:var(--panel2);border-radius:11px;padding:14px 16px;margin-top:20px;}
  .xpbar{height:8px;background:rgba(70,58,75,.8);border-radius:99px;overflow:hidden;margin-top:9px;}
  .xpbar i{display:block;height:100%;background:var(--mint);transition:width .6s;}

  /* 關聯圖與排行榜 */
  .asvg{display:block;width:100%;height:auto;max-width:480px;margin:6px auto 2px;}
  .bt{margin-top:12px;}
  .bt td{padding:9px 6px;}
  .bt tr.me{background:rgba(232,179,60,.13);}
  .bt tr.me td{color:var(--saffron);}
  .rkn{font-family:"Fraunces",Georgia,serif;font-size:15px;color:var(--muted);width:44px;}
  .boardmini{background:var(--panel2);border-radius:12px;padding:15px 16px;margin-top:20px;}

  .hide{display:none !important;}
  @media (max-width:560px){
    .app{padding:14px 12px 44px;}
    #ans{font-size:20px;} .big2{font-size:48px;} .fc .big{font-size:32px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <span class="logo">Vocab<span>Lab</span></span>
    <span class="note" id="crumb">字彙練習平台</span>
    <span class="sp"></span>
    <button class="chip" id="nav-home">課程列表</button>
    <button class="chip" id="nav-board">排行榜</button>
    <button class="chip" id="nav-manage">管理課程</button>
  </div>
  <div id="view"></div>
</div>

<script>
/* ==================================================================
   一、內建課程
   要新增永久課程，複製下面任一段的格式加進 BUILTIN 陣列即可。
   欄位：w 單字（必填）／zh 中文（必填）／pos 詞性／g 分類代碼
        ／easy 簡易英文／ex 例句／exZh 例句中文
   groups 定義分類代碼對應的名稱與顏色，可省略。
   ================================================================== */
const BUILTIN = [
{
  id:"special-assoc", title:"special 語意聯想", note:"餐飲科 · 心理語意網路 · 28 字",
  groups:{occ:{zh:"什麼場合",hex:"#E8B33C"},res:{zh:"餐廳裡",hex:"#D2553F"},deal:{zh:"特價",hex:"#8FB25B"},
          feel:{zh:"什麼感覺",hex:"#5B8FCB"},act:{zh:"會做什麼",hex:"#B77BC6"},opp:{zh:"相反的",hex:"#8C8090"}},
  words:[
    {w:"birthday",zh:"生日",g:"occ",easy:"The one day a year that belongs to you.",ex:"Is today a special day?",exZh:"今天是特別的日子嗎？"},
    {w:"anniversary",zh:"紀念日",g:"occ",easy:"The same day every year, to remember something happy.",ex:"They booked a table for their anniversary.",exZh:"他們為了紀念日訂了位子。"},
    {w:"Christmas",zh:"聖誕節",g:"occ",easy:"A holiday in December when families eat together.",ex:"We have a Christmas special this month.",exZh:"這個月我們有聖誕特餐。"},
    {w:"wedding",zh:"婚禮",g:"occ",easy:"The day two people get married.",ex:"The wedding dinner has twenty tables.",exZh:"這場婚宴有二十桌。"},
    {w:"graduation",zh:"畢業",g:"occ",easy:"The day you finish school.",ex:"They came here after graduation.",exZh:"他們畢業後來這裡吃飯。"},
    {w:"menu",zh:"菜單",g:"res",easy:"The paper that shows all the food you can order.",ex:"Today's special is on the menu.",exZh:"今日特餐印在菜單上。"},
    {w:"chef",zh:"主廚",g:"res",easy:"The person who cooks in a restaurant.",ex:"The chef's special changes every day.",exZh:"主廚特餐每天更換。"},
    {w:"dish",zh:"一道菜",g:"res",easy:"One kind of food on a plate.",ex:"This dish is very popular.",exZh:"這道菜很受歡迎。"},
    {w:"soup",zh:"湯",g:"res",easy:"Hot water with food in it, made fresh that day.",ex:"What is the soup of the day?",exZh:"今日例湯是什麼？"},
    {w:"fresh",zh:"新鮮的",g:"res",easy:"Just picked, just bought, or just made.",ex:"We use fresh food every morning.",exZh:"我們每天早上都用新鮮食材。"},
    {w:"discount",zh:"折扣",g:"deal",easy:"You pay less than the real price.",ex:"Students get a special discount.",exZh:"學生有特別折扣。"},
    {w:"coupon",zh:"折價券",g:"deal",easy:"A small paper that makes the price lower.",ex:"Show this coupon to get ten percent off.",exZh:"出示折價券可打九折。"},
    {w:"cheaper",zh:"比較便宜",g:"deal",easy:"It costs less money than before.",ex:"Lunch is cheaper than dinner.",exZh:"午餐比晚餐便宜。"},
    {w:"sale",zh:"特賣",g:"deal",easy:"A time when a shop makes things cost less.",ex:"The sale ends on Sunday.",exZh:"特賣到星期日結束。"},
    {w:"different",zh:"不一樣的",g:"feel",easy:"Not the same as everything else.",ex:"This dish is different from the others.",exZh:"這道菜和其他的不一樣。"},
    {w:"important",zh:"重要的",g:"feel",easy:"It matters a lot to you.",ex:"You're special to me.",exZh:"你對我來說很重要。"},
    {w:"rare",zh:"少見的",g:"feel",easy:"You don't see it very often.",ex:"This is a rare chance.",exZh:"這是難得的機會。"},
    {w:"lucky",zh:"幸運的",g:"feel",easy:"Good things happen to you.",ex:"You're lucky — one dish is left.",exZh:"你很幸運，還剩一份。"},
    {w:"excited",zh:"興奮期待的",g:"feel",easy:"Very happy about something that will happen soon.",ex:"The guests look excited.",exZh:"客人看起來很期待。"},
    {w:"celebrate",zh:"慶祝",g:"act",easy:"To do something fun because of a happy day.",ex:"They came to celebrate a birthday.",exZh:"他們來慶祝生日。"},
    {w:"order",zh:"點餐",g:"act",easy:"To tell someone what food you want.",ex:"I'll order today's special.",exZh:"我要點今日特餐。"},
    {w:"prepare",zh:"準備",g:"act",easy:"To get something ready before it is needed.",ex:"We prepare the food the night before.",exZh:"我們前一晚就備好食材。"},
    {w:"surprise",zh:"驚喜",g:"act",easy:"Something good that you did not know about.",ex:"The dessert is a surprise.",exZh:"這份甜點是個驚喜。"},
    {w:"book",zh:"訂位",g:"act",easy:"To keep a table for a later time.",ex:"Please book a table first.",exZh:"請先訂位。"},
    {w:"ordinary",zh:"普通的",g:"opp",easy:"Nothing special; the same as always.",ex:"It was just an ordinary day.",exZh:"那只是平常的一天。"},
    {w:"normal",zh:"正常的",g:"opp",easy:"The usual way things are.",ex:"This is the normal price.",exZh:"這是平常的價格。"},
    {w:"usual",zh:"平常的",g:"opp",easy:"What happens most of the time.",ex:"I'll have the usual.",exZh:"我要老樣子。"},
    {w:"everyday",zh:"每天都有的",g:"opp",easy:"Happening every single day.",ex:"Rice is everyday food here.",exZh:"米飯在這裡是每天都吃的食物。"}
  ]
},
{

let rate=.9, voice=null, srcMode="real", curAudio=null;
const audioCache = new Map();
function envoices(){ return window.speechSynthesis ? speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)) : []; }
function vscore(v){ let s=0;
  if(/natural/i.test(v.name))s+=100; if(/google/i.test(v.name))s+=60;
  if(/siri|samantha|ava|allison|nicky/i.test(v.name))s+=55; if(/aria|jenny|guy|eric/i.test(v.name))s+=45;
  if(/en[-_]US/i.test(v.lang))s+=20; if(/zira|david|mark|hazel/i.test(v.name))s-=15; return s; }
function initVoice(){ const vs=envoices().sort((a,b)=>vscore(b)-vscore(a)); if(vs.length && !voice) voice=vs[0]; }
if(window.speechSynthesis){ initVoice(); speechSynthesis.onvoiceschanged=initVoice; }

async function fetchAudio(word){
  if(audioCache.has(word)) return audioCache.get(word);
  let url=null;
  try{
    const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`);
    if(r.ok){
      const j = await r.json(); const c=[];
      for(const e of (Array.isArray(j)?j:[])) for(const p of (e.phonetics||[])) if(p.audio) c.push(p.audio);
      url = c.find(u=>/-us\.mp3$/i.test(u)) || c.find(u=>/-uk\.mp3$/i.test(u)) || c[0] || null;
    }
  }catch(e){}
  audioCache.set(word,url); return url;
}
function prefetch(ws){ if(srcMode==="real") ws.forEach(w=>fetchAudio(w.w||w)); }
function flash(el,on){ if(el) el.classList.toggle("on",on); }
async function say(text, r, el){
  const speed = r || rate;
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(curAudio){ curAudio.pause(); curAudio=null; }
  const single = !/\s/.test(text);
  if(srcMode==="real" && single){
    const url = await fetchAudio(text);
    if(url){
      const a=new Audio(url);
      a.playbackRate=Math.max(.55,Math.min(1,speed+.1));
      if("preservesPitch" in a) a.preservesPitch=true;
      flash(el,true); a.onended=a.onerror=()=>flash(el,false); curAudio=a;
      try{ await a.play(); return "real"; }catch(e){ flash(el,false); }
    }
  }
  if(!window.speechSynthesis){ alert("這個瀏覽器不支援語音，請用 Chrome、Edge 或 Safari。"); return; }
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=speed; if(voice)u.voice=voice;
  flash(el,true); u.onend=u.onerror=()=>flash(el,false);
  speechSynthesis.speak(u); return "tts";
}

/* ================= CSV / TSV 解析 ================= */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=="\r") f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
function parseTSV(text){
  return text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split("\t"));
}
const HEAD = {
  w:["單字","word","英文","vocabulary","字"],
  zh:["中文","解釋","中文解釋","meaning","chinese","翻譯"],
  pos:["詞性","pos","part of speech"],
  g:["分類","群組","group","category","類別"],
  easy:["簡易英文","簡易","easy","簡單說法","簡易說法"],
  ex:["例句","example","sentence","英文例句"],
  exZh:["例句中文","例句翻譯","example zh","中文例句"]
};
function mapHeader(cells){
  const idx={};
  cells.forEach((c,i)=>{
    const t=c.trim().toLowerCase();
    for(const k in HEAD) if(HEAD[k].some(h=>h.toLowerCase()===t)) idx[k]=i;
  });
  return idx;
}
function rowsToWords(rows){
  if(!rows.length) return {words:[],err:"沒有讀到任何資料"};
  let idx=mapHeader(rows[0]), start=1;
  if(idx.w===undefined || idx.zh===undefined){ idx={w:0,zh:1,pos:2,g:3,easy:4,ex:5,exZh:6}; start=0; }
  const words=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i], g=k=> idx[k]!==undefined && r[idx[k]] ? r[idx[k]].trim() : "";
    const w=g("w"); if(!w) continue;
    words.push({w, zh:g("zh"), pos:g("pos"), g:g("g"), easy:g("easy"), ex:g("ex"), exZh:g("exZh")});
  }
  return {words, err: words.length?"":"找不到有效的單字列，請確認第一欄是英文單字、第二欄是中文"};
}
const PAL=["#E8B33C","#D2553F","#8FB25B","#5B8FCB","#B77BC6","#6FC2A8","#8C8090"];
function autoGroups(words){
  const gs={}; let i=0;
  words.forEach(w=>{ if(w.g && !gs[w.g]){ gs[w.g]={zh:w.g,hex:PAL[i++%PAL.length]}; } });
  return Object.keys(gs).length?gs:null;
}

function buildPrefill(data){

  const p=new URLSearchParams(); p.set("usp","pp_url");
  let any=false;
  FIELDS.forEach(([k])=>{

    if(ent && data[k]!==undefined && data[k]!==""){ p.set(ent,data[k]); any=true; }
  });

function parsePrefill(raw){
  let u;
  try{ u=new URL(raw.trim()); }catch(e){ return {err:"這不是有效的網址"}; }
  if(!/docs\.google\.com/.test(u.hostname)) return {err:"請貼 Google 表單的「預先填入連結」"};
  const entries=[];
  u.searchParams.forEach((v,k)=>{ if(/^entry\./.test(k)) entries.push({k,v}); });
  if(!entries.length) return {err:"連結裡沒有偵測到欄位。請確認是用「取得預先填入的連結」產生，而且每一格都先填了字。"};
  const base=u.origin+u.pathname.replace(/\/(formResponse|edit)[^/]*$/,"/viewform");
  return {base,entries};
}

function assocSVG(word, L, reveal){
  const gs=L.groups||autoGroups(L.words)||{};
  const t=L.words.find(x=>x.w===word)||{};
  const hex=(t.g&&gs[t.g])?gs[t.g].hex:"#6FC2A8";
  const sibs=shuffle(L.words.filter(x=>x.g&&x.g===t.g&&x.w!==word)).slice(0,4);
  const spokes=[];
  if(t.g&&gs[t.g]) spokes.push({t:gs[t.g].zh,k:"分類",c:hex});
  if(t.easy) spokes.push({t:cut(t.easy,26),k:"簡易英文",c:"#6FC2A8"});
  if(reveal&&t.zh) spokes.push({t:t.zh,k:"中文",c:"#F2EDE4"});
  if(t.ex) spokes.push({t:cut(reveal?t.ex:t.ex.replace(new RegExp(word,"gi"),"____"),30),k:"例句",c:"#A395A8"});
  sibs.forEach(s=>spokes.push({t:s.w,k:s.zh||"同類字",c:"#8C8090"}));
  const n=Math.min(spokes.length,6), R=118, CX=240, CY=152;
  let out=`<svg viewBox="0 0 480 304" class="asvg">`;
  const pts=[];
  for(let i=0;i<n;i++){
    const a=(-90+i*(360/n))*Math.PI/180;
    pts.push({x:CX+Math.cos(a)*R, y:CY+Math.sin(a)*R, a});
  }
  pts.forEach((p,i)=>{ out+=`<line x1="${CX}" y1="${CY}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="${spokes[i].c}" stroke-width="1.4" opacity=".42"/>`; });
  pts.forEach((p,i)=>{
    const s=spokes[i], right=Math.cos(p.a)>=-0.15, an=right?"start":"end", dx=right?11:-11;
    out+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="${s.c}" opacity=".9"/>`;
    out+=`<text x="${(p.x+dx).toFixed(1)}" y="${(p.y-1).toFixed(1)}" text-anchor="${an}" font-size="12.5" fill="${s.c}" font-family="Fraunces,Georgia,serif">${esc(s.t)}</text>`;
    out+=`<text x="${(p.x+dx).toFixed(1)}" y="${(p.y+12).toFixed(1)}" text-anchor="${an}" font-size="9.5" fill="#A395A8" font-family="Noto Sans TC,sans-serif">${esc(s.k)}</text>`;
  });

  if(reveal){
    out+=`<text x="${CX}" y="${CY+4}" text-anchor="middle" font-size="20" fill="#201A24" font-family="Fraunces,Georgia,serif">${esc(cut(word,10))}</text>`;

  }
  return out+`</svg>`;
}
function cut(s,n){ s=String(s); return s.length>n? s.slice(0,n-1)+"…" : s; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- 排行榜 ---------- */
let board=null, boardBusy=false;
const BHEAD={name:/姓名|名字|name/i, cls:/班級|class/i, seat:/座號|座位|seat/i,
             lesson:/課程|課|lesson/i, score:/分數|成績|score/i, time:/時間戳記|timestamp|時間/i};
async function loadBoard(force){
  if(!store.boardId) return null;
  if(board && !force) return board;
  if(boardBusy) return board;
  boardBusy=true;
  try{
    const nm=store.boardTab||"";
    const r=await fetch(`https://docs.google.com/spreadsheets/d/${store.boardId}/gviz/tq?tqx=out:csv${nm?"&sheet="+encodeURIComponent(nm):""}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const txt=await r.text();
    if(/^</.test(txt.slice(0,5))) throw new Error("沒有公開檢視權限");
    const rows=parseCSV(txt);
    if(rows.length<2) throw new Error("試算表沒有資料");
    const idx={};
    rows[0].forEach((c,i)=>{ for(const k in BHEAD) if(idx[k]===undefined && BHEAD[k].test(c.trim())) idx[k]=i; });
    if(idx.name===undefined||idx.score===undefined) throw new Error("找不到「姓名」或「分數」欄位");
    const recs=[];
    for(let i=1;i<rows.length;i++){
      const g=k=> idx[k]!==undefined && rows[i][idx[k]]!==undefined ? String(rows[i][idx[k]]).trim() : "";
      const sc=parseFloat(g("score"));
      if(!g("name")||isNaN(sc)) continue;
      recs.push({name:g("name"),cls:g("cls"),seat:g("seat"),lesson:g("lesson"),score:sc,time:g("time")});
    }
    board={recs, at:Date.now(), err:null};
  }catch(e){ board={recs:[],at:Date.now(),err:e.message}; }
  boardBusy=false;
  return board;
}
function aggregate(recs, lesson){
  const f = lesson ? recs.filter(r=>r.lesson===lesson) : recs;
  const m=new Map();
  f.forEach(r=>{
    const k=(r.cls||"")+"/"+(r.seat||"")+"/"+r.name;
    const p=m.get(k);
    if(!p||r.score>p.score) m.set(k,{...r,tries:(p?p.tries:0)+1});
    else p.tries++;
  });
  return [...m.values()].sort((a,b)=>b.score-a.score);
}
function anon(r){
  if(store.boardAnon){
    const n=r.name||""; 
    return (r.cls?r.cls+" ":"")+(r.seat?r.seat+"號 ":"")+(n?n[0]+"○"+(n.length>2?"○":""):"");
  }
  return (r.cls?r.cls+" ":"")+(r.seat?r.seat+"　":"")+(r.name||"");
}
function isMe(r){
  const s=store.student||{};
  return s.name && r.name===s.name && (!s.seat||!r.seat||r.seat===s.seat);
}
function boardTable(list, limit){

    html+=`<tr class="${isMe(r)?"me":""}"><td class="rkn">${medal}</td><td class="z">${esc(anon(r))}</td>

/* ---------- 聽打練習（遊戲化計分） ---------- */
const TOTAL=10, BASE=100;
const RANKS=[[0,"洗碗工"],[600,"廚房學徒"],[1800,"三廚"],[4000,"二廚"],[8000,"副主廚"],[14000,"主廚"],[24000,"行政主廚"]];
function rankOf(xp){ let r=RANKS[0]; for(const x of RANKS) if(xp>=x[0]) r=x; return r; }
function nextRank(xp){ return RANKS.find(x=>x[0]>xp)||null; }
function r1(a,b){ return Math.round((a+Math.random()*(b-a))*10)/10; }

/* 依單字內容決定作答時間 */
function timeFor(w){
  const letters=w.replace(/[^A-Za-z]/g,"").length;
  const parts=w.trim().split(/\s+/).length;
  let t=4200 + letters*560 + (parts-1)*1800;
  if(/(ough|eau|ph|gh|kn|wr|mb|sc|ei|ie|tion|sion|ary|ously)/i.test(w)) t+=1600;   // 拼字不規則
  if(/(.)\1/.test(w)) t+=700;                                                       // 雙寫字母
  return Math.round(Math.max(6500, Math.min(24000, t)));
}

let quiz=[],qi=0,cur=null,qlog=[],QL=null,combo=0,total=0,timerId=null,tStart=0,expired=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function comboMul(c){ return c>=5?3 : c>=4?2.5 : c>=3?2 : c>=2?1.5 : c>=1?1.2 : 1; }
function makeRound(pool){
  let list=shuffle(pool); while(list.length<TOTAL) list=list.concat(shuffle(pool));
  const q=list.slice(0,TOTAL).map(w=>({...w}));
  const kn=Math.random()<.45?2:1;
  shuffle([...Array(TOTAL).keys()]).slice(0,kn).forEach(i=>q[i].king=true);
  q.forEach(x=>{ x.up=x.king?r1(4,6):r1(0.8,2.5); x.dn=x.king?r1(1.2,2.4):r1(0.3,1.5); x.limit=timeFor(x.w); });
  return q;
}

function startTimer(){
  tStart=Date.now();
  const LIM=cur.limit;
  timerId=setInterval(()=>{
    const el=Date.now()-tStart, left=Math.max(0,LIM-el);
    const f=V.querySelector("#tfill"), tl=V.querySelector("#tleft"), tv=V.querySelector("#tval");
    if(!f){ stopTimer(); return; }
    const pct=left/LIM;
    f.style.width=(pct*100)+"%";
    f.style.background = pct>.5?"var(--mint)" : pct>.25?"var(--saffron)":"var(--paprika)";
    if(tl) tl.textContent=(left/1000).toFixed(1)+" 秒";
    if(tv) tv.textContent = cur.done?"已作答":`答對可得 ${curValue()} 點`;
    if(left<=0 && !expired){
      expired=true;
      if(!cur.done){
        const d=Math.round(30*cur.dn); total-=d; cur.lost+=d; upd(); pop(`時間到 −${d}`,"bad");
        if(tl) tl.textContent="時間到";
      }
      stopTimer();
    }
  },100);
}
function decay(){
  if(expired) return .4;
  const left=Math.max(0,cur.limit-(Date.now()-tStart));
  return .4 + (left/cur.limit)*.6;
}
function curValue(){
  if(cur.rev) return 0;
  const p = cur.wrong>0 ? .35 : (cur.hint ? .6 : 1);
  return Math.round(BASE*cur.up*decay()*comboMul(combo)*p);
}

  const el=V.querySelector("#sc2");
  if(el){ el.innerHTML=Math.round(total).toLocaleString()+"<small> 點</small>";

  if(c){ c.textContent=`連擊 ${combo} ${combo>=1?`×${comboMul(combo)}`:""}`; c.classList.toggle("hot",combo>=2); }

  b.textContent = k==="real"?"🎧 真人錄音":"🔊 合成語音";

function diffHTML(t,g){
  const out=[],n=Math.max(t.length,g.length);
  for(let i=0;i<n;i++){
    if(i>=t.length) out.push(`<span class="miss">${g[i]}</span>`);
    else if(i>=g.length) out.push(`<span class="no">${t[i]}</span>`);
    else if(t[i].toLowerCase()===g[i].toLowerCase()) out.push(`<span class="ok">${t[i]}</span>`);
    else out.push(`<span class="no">${t[i]}</span>`);
  }
  return out.join("");
}

function submit(){
  const ans=V.querySelector("#ans"), fb=V.querySelector("#fb"), play=V.querySelector("#play");
  if(cur.done){ if(qi===TOTAL-1) finish(); else {qi++;drawQ();} return; }
  const v=ans.value.trim(); if(!v) return;
  if(v.toLowerCase()===cur.w.toLowerCase()){
    const gain=curValue();
    const clean = cur.wrong===0 && !cur.hint && !cur.rev && !expired;
    stopTimer();
    cur.done=true; total+=gain;
    if(clean) combo++; else combo=0;
    ans.className="good"; ans.disabled=true;
    V.querySelector("#ok").textContent = qi===TOTAL-1?"看成績 →":"下一題 →";
    ["hz","rv"].forEach(id=>{const b=V.querySelector("#"+id);b.disabled=true;b.style.opacity=.4;});
    qlog.push({w:cur.w,zh:cur.zh,gain,lost:cur.lost,wrong:cur.wrong,clean,rev:cur.rev,king:cur.king,up:cur.up,dn:cur.dn});
    upd(); pop(`+${gain}`,"good");
    if(cur.king) pop("👑","king");
    if(combo>=2) pop(`連擊 ×${comboMul(combo)}`,"combo");
    fb.className="fb right";
    fb.innerHTML=`<div class="fb-h">${cur.king?"👑 國王題入袋":clean?`一次答對　+${gain}`:`訂正正確　+${gain}`}</div>
      ${assocSVG(cur.w,QL,true)}
      <p class="note" style="margin:6px 0 0">本題淨得 ${gain-cur.lost} 點${cur.lost?`（加 ${gain}、扣 ${cur.lost}）`:""}</p>`;
    V.querySelector("#ok").focus();
  }else{
    cur.wrong++;
    const d=Math.round(50*cur.dn);
    total-=d; cur.lost+=d;
    if(combo>0) pop("連擊中斷","bad");
    combo=0;
    ans.className="bad"; setTimeout(()=>ans.className="",340);
    upd(); pop(`−${d}`,"bad");
    fb.className="fb wrong";
    fb.innerHTML=`<div class="fb-h">拼錯　−${d}　（扣分倍率 ×${cur.dn}）</div>
      <div class="diff">${diffHTML(v,cur.w)}</div>
      <p class="zh" style="margin:0;color:#DCD2DE;font-size:13px">綠色正確、紅波浪錯誤、灰色是漏掉的字母。改好再送出，訂正正確仍可拿回部分分數。</p>`;
    ans.select(); say(cur.w,Math.max(.45,rate-.15),play);
  }
}

async function finish(){
  stopTimer();
  const gained=qlog.reduce((s,r)=>s+r.gain,0);

  const cleans=qlog.filter(r=>r.clean).length;
  const kings=qlog.filter(r=>r.king);
  const target=quiz.slice(0,Math.max(1,qlog.length)).reduce((s,q)=>s+BASE*q.up,0);
  const ratio=target?total/target:0;
  const grade=Math.max(0,Math.min(100,Math.round(ratio*100*10)/10));

  let rk,rc,rt;
  if(ratio>=1.15){rk="S";rc="var(--saffron)";rt="連擊拉滿，國王題也吃下了";}
  else if(ratio>=.9){rk="A";rc="var(--mint)";rt="穩定又快，維持這個節奏";}
  else if(ratio>=.65){rk="B";rc="var(--pistachio)";rt="底子有了，加快反應就能上 A";}
  else if(ratio>=.35){rk="C";rc="var(--cobalt)";rt="先把錯的字練熟再衝速度";}
  else {rk="D";rc="var(--paprika)";rt="範圍縮小成一個分類，慢慢來";}

  const xpGain=Math.max(0,Math.round(total*.5));
  const oldXp=store.xp||0, oldRank=rankOf(oldXp);
  store.xp=oldXp+xpGain;
  const newRank=rankOf(store.xp), levelUp=newRank[1]!==oldRank[1];
  store.best=store.best||{}; store.tries=store.tries||{};
  store.tries[QL.id]=(store.tries[QL.id]||0)+1;
  const isBest = grade>(store.best[QL.id]??-Infinity);

  const nx=nextRank(store.xp);

  V.innerHTML=`
    <div class="card">

      <div style="text-align:center">

        <p class="big2" style="color:${rc}">${grade.toFixed(1)}<small> / 100</small></p>
        <div class="zh" style="color:${rc};margin-top:4px">${rt}</div>
        ${isBest?`<div class="best">★ 本課新紀錄</div>`:""}
        <div class="note" style="margin-top:8px">${QL.title}　·　遊戲點數 ${Math.round(total).toLocaleString()}　·　第 ${store.tries[QL.id]} 次挑戰</div>
      </div>
      <div class="xpbox">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="rk">${newRank[1]}</span>
          <span class="note">+${xpGain.toLocaleString()} XP　總計 ${store.xp.toLocaleString()}</span>
        </div>
        ${nx?`<div class="xpbar"><i style="width:${Math.min(100,((store.xp-newRank[0])/(nx[0]-newRank[0])*100)).toFixed(1)}%"></i></div>
        <div class="note" style="margin-top:5px">距離 ${nx[1]} 還差 ${(nx[0]-store.xp).toLocaleString()} XP</div>`
        :`<div class="note" style="margin-top:8px">已達最高階級</div>`}
      </div>
      <div class="stats">
        <div class="stat"><div class="v" style="color:var(--pistachio)">+${gained.toLocaleString()}</div><div class="k">總加分</div></div>
        <div class="stat"><div class="v" style="color:var(--paprika)">−${lost.toLocaleString()}</div><div class="k">總扣分</div></div>
        <div class="stat"><div class="v">${cleans}</div><div class="k">一次答對</div></div>
        <div class="stat"><div class="v">${kings.filter(k=>k.clean).length}/${kings.length}</div><div class="k">👑 國王題</div></div>
      </div>

      ${qlog.map((r,i)=>`<tr${r.king?' style="background:rgba(232,179,60,.07)"':""}>
        <td class="w">${r.king?"👑 ":""}<span style="cursor:pointer;border-bottom:1px dotted var(--muted)" data-say="${r.w}">${r.w}</span>

  const rw=V.querySelector("#rw");

  };
  V.querySelector("#ag").onclick=()=>go("dict",{id:QL.id});
  V.querySelector("#hm").onclick=()=>go("home");

  const snd=V.querySelector("#send");

function bindForm(){

    if(r.err){ msg("#fmsg",r.err,false); return; }
    // 依老師填的字自動猜對應
    const guess={};
    const HINT={cls:/班|class/i,seat:/座|號|seat|no/i,name:/姓名|名字|name/i,
                lesson:/課|lesson|unit/i,score:/分|成績|score/i,detail:/明細|細節|detail|note/i};
    FIELDS.forEach(([k])=>{
      const hit=r.entries.find(e=>HINT[k].test(e.v||""));
      if(hit && !Object.values(guess).includes(hit.k)) guess[k]=hit.k;
    });
    store.form={url:r.base, entries:r.entries, map:guess};
    saveStore(store);
    msg("#fmsg",`偵測到 ${r.entries.length} 個欄位${Object.keys(guess).length?`，已自動對應 ${Object.keys(guess).length} 項，請確認下方是否正確。`:"，請在下方手動指定。"}`,true);
    V.querySelector("#fmap").innerHTML=renderMap(r.entries,guess);
    bindMapSave();
  };
  const clr=V.querySelector("#fclear");
  if(clr) clr.onclick=()=>{ if(confirm("清除成績回傳設定？")){ store.form=null; saveStore(store); vManage(); } };
  bindMapSave();
}
function bindMapSave(){
  const b=V.querySelector("#fsave"); if(!b) return;
  b.onclick=()=>{
    const map={};
    V.querySelectorAll("[data-f]").forEach(s=>{ if(s.value) map[s.dataset.f]=s.value; });
    if(!map.name||!map.score){ msg("#fmsg","至少要指定「姓名」和「分數」兩個欄位。",false); return; }
    store.form.map=map; saveStore(store);
    const demo=buildPrefill({cls:"餐一丙",seat:"1",name:"測試學生",lesson:"測試課程",score:"10.0",detail:"測試明細"});
    msg("#fmsg",`已儲存。<a href="${demo}" target="_blank" style="color:var(--mint);text-decoration:underline">點這裡開啟測試連結</a>，確認每一格都填到正確的位置（測試完記得別按提交，或提交後把那筆資料刪掉）。`,true);
  };
}
function bindBoard(){
  const t=V.querySelector("#btest"); if(!t) return;
  t.onclick=async()=>{
    store.boardId=V.querySelector("#bid").value.trim();
    store.boardTab=V.querySelector("#btab").value.trim();
    store.boardAnon=V.querySelector("#banon").value==="1";
    saveStore(store);
    if(!store.boardId){ msg("#bmsg","請先填試算表 ID",false); return; }
    msg("#bmsg","讀取中…",true);
    const b=await loadBoard(true);
    if(b.err) msg("#bmsg",`讀取失敗：${esc(b.err)}<br><br>常見原因：權限沒開成「知道連結的任何人」、工作表名稱打錯、或欄位名稱不含「姓名」「分數」。`,false);
    else if(!b.recs.length) msg("#bmsg","讀到試算表了，但還沒有任何成績資料。等學生送出第一筆就會出現。",true);
    else msg("#bmsg",`成功讀到 ${b.recs.length} 筆成績，共 ${aggregate(b.recs).length} 位參賽者。`,true);
  };
  const c=V.querySelector("#bclear");
  if(c) c.onclick=()=>{ if(confirm("清除排行榜設定？")){ store.boardId="";store.boardTab="";board=null; saveStore(store); vManage(); } };
}
function msg(id,txt,ok){ const e=V.querySelector(id); if(e) e.innerHTML=`<div class="msg ${ok?"ok":"er"}">${txt}</div>`; }

async function loadSheet(){
  const id=V.querySelector("#sid").value.trim();
  const tabs=V.querySelector("#stabs").value.trim();
  if(!id){ msg("#smsg","請先填試算表 ID",false); return; }
  msg("#smsg","讀取中…",true);
  const names = tabs? tabs.split(",").map(s=>s.trim()).filter(Boolean) : [""];
  const out=[], errs=[];
  for(const nm of names){
    const url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${nm?"&sheet="+encodeURIComponent(nm):""}`;
    try{
      const r=await fetch(url);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const txt=await r.text();
      if(/^<|Google Docs/i.test(txt.slice(0,40))) throw new Error("沒有公開檢視權限");
      const {words,err}=rowsToWords(parseCSV(txt));
      if(err) throw new Error(err);
      out.push({id:"sheet-"+(nm||"main"), title:nm||"試算表課程", note:"來自 Google 試算表",
                groups:autoGroups(words), words});
    }catch(e){ errs.push(`${nm||"預設工作表"}：${e.message}`); }
  }
  sheetLessons=out;
  store.sheetId=id; store.sheetTabs=tabs; saveStore(store);
  if(out.length) msg("#smsg",`成功讀取 ${out.length} 個課程，共 ${out.reduce((s,l)=>s+l.words.length,0)} 字。${errs.length?"<br>失敗："+errs.join("；"):""}`,true);
  else msg("#smsg","讀取失敗：<br>"+errs.join("<br>")+"<br><br>常見原因：權限沒開成「知道連結的任何人」、工作表名稱打錯、或校內網路擋住 Google。",false);
}

function addPaste(){
  const t=V.querySelector("#ptitle").value.trim()||"未命名課程";
  const d=V.querySelector("#pdata").value;
  if(!d.trim()){ msg("#pmsg","請先貼上內容",false); return; }
  const rows = d.includes("\t") ? parseTSV(d) : parseCSV(d);
  const {words,err}=rowsToWords(rows);
  if(err){ msg("#pmsg",err,false); return; }
  store.custom.push({id:"p-"+Date.now(), title:t, note:"貼上建立", groups:autoGroups(words), words});
  saveStore(store);
  msg("#pmsg",`已建立「${t}」，共 ${words.length} 字。`,true);
  setTimeout(()=>go("home"),700);
}

function exportJSON(){
  const data=[...BUILTIN,...sheetLessons,...store.custom].map(({_src,...l})=>l);
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="vocablab-lessons.json"; a.click();
  msg("#emsg","已下載 JSON。可以把裡面的內容貼進檔案最上方的 BUILTIN 陣列，變成永久課程。",true);
}
function importJSON(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json";
  i.onchange=()=>{
    const f=i.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        const list=Array.isArray(d)?d:[d];
        let n=0;
        list.forEach(l=>{ if(l.words&&l.words.length){ l.id=l.id||"i-"+Date.now()+Math.random(); store.custom.push(l); n++; } });
        saveStore(store); msg("#emsg",`匯入 ${n} 個課程。`,true); setTimeout(()=>go("home"),700);
      }catch(e){ msg("#emsg","檔案格式不正確",false); }
    };
    rd.readAsText(f);
  };
  i.click();
}

/* ---------- 啟動 ---------- */
(async function(){
  const q=new URLSearchParams(location.search);
  const sid=q.get("sheet")||store.sheetId, tabs=q.get("tabs")||store.sheetTabs;
  if(sid){
    store.sheetId=sid; store.sheetTabs=tabs||"";
    const names = tabs? tabs.split(",").map(s=>s.trim()).filter(Boolean) : [""];
    for(const nm of names){
      try{
        const r=await fetch(`https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv${nm?"&sheet="+encodeURIComponent(nm):""}`);
        if(!r.ok) continue;
        const txt=await r.text();
        if(/^</.test(txt.slice(0,5))) continue;
        const {words}=rowsToWords(parseCSV(txt));
        if(words.length) sheetLessons.push({id:"sheet-"+(nm||"main"),title:nm||"試算表課程",note:"來自 Google 試算表",groups:autoGroups(words),words});
      }catch(e){}
    }
  }
  render();
})();
</script>
